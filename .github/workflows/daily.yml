name: Daily summary

on:
  schedule:
    - cron: '30 17 * * *' # 毎日 JST 2:30(前日 23 時台の確認が遅れて終わるのを待ってから集計する)
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # まとめをコミットする
      actions: write # 毎時の確認の結果(artifact)を読む・毎時の確認のワークフローを有効にし直す
      issues: write # 証明書の期限の Issue
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # ランナーに入っている古いパッチ版で済ませず、毎回最新のパッチ版を使う(脆弱性の修正を待たずに取り込むため)
          check-latest: true
          package-manager-cache: false

      - name: Summarize
        run: node scripts/daily.mjs

      # このコミットは、60 日間動きの無いリポジトリで定期実行が止まるのを防ぐ役目も兼ねる
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports README.md
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          day=$(node -e "console.log(require('./data/summary.json').at(-1).day)")
          git commit -m "日次の稼働まとめ(${day})"
          git push
