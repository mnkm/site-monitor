name: Check sites

on:
  schedule:
    # 予備の定期実行。ふだんは Cloudflare Workers(worker/)が毎時 0 分に手動実行として起動し、こちらは gate で何もせずに終わる
    - cron: '5 * * * *' # 毎時 5 分(毎時 0 分は GitHub Actions が混み、遅れや取りこぼしが増えるため避ける)
  workflow_dispatch:
    inputs:
      simulate_down:
        description: '動作確認用: 停止したことにする対象の id(targets.json)。空なら通常の確認'
        required: false
        default: ''

# 権限はジョブで必要な分だけ与える
permissions: {}

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  # 定期実行のときだけ、この回が受け持つ時間帯(毎時 5 分の予定時刻を含む 1 時間)の始まり以降に
  # 手動実行(Cloudflare Workers からの起動を含む)が作られていれば確認を省く
  # (同じ時間帯を二重に確認して、日次のまとめの確認回数が 24 を超えないように。
  #  Workers の起動が 1 回失敗したときは、その時間帯の定期実行が代わりに確認する)
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: recent
        run: |
          # 定期実行は遅れることはあっても早まらないので、この実行が作られた時刻の 5 分前が属する時間帯を受け持ちとする
          # (gate が動き出した時刻は、順番待ちで遅れることがあるので使わない)
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          since=$(date -u -d "@$(( $(date -u -d "$created" +%s) - 300 ))" +%Y-%m-%dT%H:00:00Z)
          # 同時実行の制限で取り消された手動実行は、確認していないので数えない(待機中・実行中のものは数える)
          count=$(gh run list -R "$GITHUB_REPOSITORY" --workflow check.yml --event workflow_dispatch --limit 5 --json createdAt,conclusion \
            --jq "[.[] | select(.createdAt >= \"$since\" and .conclusion != \"cancelled\")] | length")
          if [ "$count" -gt 0 ]; then
            echo "この時間帯にはすでに手動実行があるので、この回は確認しない"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    # 手動実行では gate が動かない(skipped)ので、gate が省くと決めたとき以外は確認する(gate が失敗したときも確認する)
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # 前回の結果(artifact)を読む
      issues: write # 停止の Issue を作る・閉じる
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # 連続して失敗した回数を数えるため、前回の結果を取ってくる(無ければ最初の 1 回として扱う)
      # フォークからの Pull Request の実行も同じワークフローの実行として一覧に出るため、
      # 定期実行と手動実行の結果だけを使う。gate で確認を省いた定期実行には結果が無いので、
      # 新しい順にたどって、結果のある実行を前回とする
      - name: Download previous result
        run: |
          ids=$( {
            gh run list --workflow check.yml --event schedule --status completed --limit 5 --json databaseId --jq '.[].databaseId'
            gh run list --workflow check.yml --event workflow_dispatch --status completed --limit 5 --json databaseId --jq '.[].databaseId'
          } | sort -rn )
          for id in $ids; do
            if gh run download "$id" --dir "$RUNNER_TEMP/prev" 2>/dev/null; then break; fi
          done
          [ -n "$(ls -A "$RUNNER_TEMP/prev" 2>/dev/null)" ] || echo "前回の結果を取得できなかった"
          file=$(find "$RUNNER_TEMP/prev" -name result.json 2>/dev/null | head -n 1)
          echo "PREV_RESULT=${file}" >> "$GITHUB_ENV"

      - name: Check sites
        env:
          SIMULATE_DOWN: ${{ inputs.simulate_down }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: node scripts/check.mjs "$RUNNER_TEMP/result/result.json" "$PREV_RESULT"

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=result-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 7 # 日次のまとめが飛んでも、後の実行でさかのぼって集計できるように

      # 結果の保存を先に済ませる(Issue の更新が失敗しても、連続失敗の回数と日次のまとめが途切れないように)
      - name: Update issues
        run: node scripts/issues.mjs "$RUNNER_TEMP/result/result.json"
