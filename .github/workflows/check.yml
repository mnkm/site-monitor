name: Check sites

on:
  schedule:
    - cron: '23 * * * *' # 毎時 23 分(毎時 0 分は GitHub Actions が混み、遅れや取りこぼしが増えるため避ける)
  workflow_dispatch:
    inputs:
      simulate_down:
        description: '動作確認用: 停止したことにする対象の id(targets.json)。空なら通常の確認'
        required: false
        default: ''

# 権限はジョブで必要な分だけ与える
permissions: {}

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # 前回の結果(artifact)を読む
      issues: write # 停止の Issue を作る・閉じる
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # 連続して失敗した回数を数えるため、前回の結果を取ってくる(無ければ最初の 1 回として扱う)
      - name: Download previous result
        run: |
          prev=$(gh run list --workflow check.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prev" ]; then
            gh run download "$prev" --dir "$RUNNER_TEMP/prev" || echo "前回の結果を取得できなかった"
          fi
          file=$(find "$RUNNER_TEMP/prev" -name result.json 2>/dev/null | head -n 1)
          echo "PREV_RESULT=${file}" >> "$GITHUB_ENV"

      - name: Check sites
        env:
          SIMULATE_DOWN: ${{ inputs.simulate_down }}
        run: node scripts/check.mjs "$RUNNER_TEMP/result/result.json" "$PREV_RESULT"

      - name: Set artifact name
        run: echo "ARTIFACT_NAME=result-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 7 # 日次のまとめが飛んでも、後の実行でさかのぼって集計できるように

      # 結果の保存を先に済ませる(Issue の更新が失敗しても、連続失敗の回数と日次のまとめが途切れないように)
      - name: Update issues
        run: node scripts/issues.mjs "$RUNNER_TEMP/result/result.json"
